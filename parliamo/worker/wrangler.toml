# Parliamo AI-szerver (Cloudflare Worker).
# Titkos értékek, amiket NEM ide kell írni, hanem `wrangler secret put` paranccsal vagy a GitHub Actions titkaiként adsz meg:
#   ANTHROPIC_API_KEY  a Claude API-kulcsod
#   APP_PASSWORD       a belépőkód, amit a webapp Beállításainál megadsz
name = "parliamo-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Vesszővel elválasztva: honnan hívhatja a szervert böngésző.
ALLOWED_ORIGINS = "https://jtdevzero.github.io"
MODEL = "claude-opus-5-5"
# Havi kemény AI-költségkorlát dollárban (0 = nincs). Elérésekor a szerver a hónap végéig nem hív AI-t.
MONTHLY_BUDGET_USD = "0"
# Árak a költségbecsléshez ($ / millió token), Claude Opus 5.5 szerint.
PRICE_IN_PER_MTOK = "4"
PRICE_OUT_PER_MTOK = "20"

# Napi emlékeztető: óránként ellenőrzi, kinek van most a beállított órája.
[triggers]
crons = ["0 * * * *"]

# A push-feliratkozások tárolója (KV). Az id-t a GitHub Actions telepítés automatikusan beírja;
# gépről: `npx wrangler kv namespace create parliamo-push`, majd az id ide.
# [[kv_namespaces]]
# binding = "PUSH"
# id = "..."

# Legfeljebb 20 kérés percenként, hogy egy kiszivárgott belépőkóddal se lehessen nagy számlát csinálni.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60
