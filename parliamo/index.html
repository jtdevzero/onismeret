/* ============ SYNC BETWEEN DEVICES (web app) ============ */
/* Progress is stored on the user's own server (worker/ /sync) next to the AI proxy, guarded by the same access code.
   Each device merges field by field, so practising on two phones in one day loses nothing. */
const DEVICE_KEYS=["proxy","pass","remind","cloud","lang","sound","rate","theme","fs","readable"];
let cloudT=null, cloudRev=0, cloudBusy=false, cloudAt=0, cloudErr="";
function mergeState(a,b){
  const newer=(b.updatedAt||0)>(a.updatedAt||0)?b:a, older=newer===a?b:a, o=JSON.parse(JSON.stringify(newer));
  const per=(k,better)=>{const m=Object.assign({},older[k]||{});for(const [x,v] of Object.entries(newer[k]||{}))m[x]=m[x]===undefined||better(v,m[x])?v:m[x];o[k]=m;};
  const num=(v,w)=>(typeof v==="number"?v:0)>=(typeof w==="number"?w:0);
  per("days",num);per("rounds",num);
  per("cards",(v,w)=>(v.last||0)>=(w.last||0));
  per("lessons",(v,w)=>(v.done?1:0)>(w.done?1:0)||((v.done?1:0)===(w.done?1:0)&&(v.best||0)>=(w.best||0)));
  per("log",(v,w)=>(v.n||0)>=(w.n||0));per("drills",(v,w)=>(v.n||0)>=(w.n||0));per("exam",(v,w)=>(v.n||0)>=(w.n||0));
  per("certs",(v,w)=>(v.score||0)>=(w.score||0));per("plan",(v,w)=>(v.at||0)>=(w.at||0));per("readDone",()=>true);per("dlg",()=>true);per("stories",()=>true);per("pods",()=>true);per("chal",()=>true);per("ai",()=>true);per("hard",()=>true);
  per("core",()=>true);per("gram",(v,w)=>(v.d||0)>=(w.d||0));per("ser",()=>true);per("mock",(v,w)=>(v.length||0)>=(w.length||0));
  const cat=(k,key,max)=>{const seen=new Set();o[k]=[...(a[k]||[]),...(b[k]||[])].filter(x=>{const id=key(x);return !seen.has(id)&&seen.add(id);}).sort((x,y)=>(x.at||0)-(y.at||0)).slice(-max);};
  cat("journal",x=>x.at,120);cat("spk",x=>x.at,60);cat("imp",x=>x.at,10);per("shadow",num);per("col",(v,w)=>(v.d||0)>=(w.d||0));
  cat("evidence",x=>x.id,80);
  o.dailySessions=Object.assign({},older.dailySessions||{});
  for(const [l,v] of Object.entries(newer.dailySessions||{})){
    const w=o.dailySessions[l];
    if(!w||v.day>w.day){o.dailySessions[l]=v;continue;}if(v.day<w.day)continue;
    const top=(v.at||0)>=(w.at||0)?v:w,other=top===v?w:v,sameLesson=top.lessonId===other.lessonId;
    const sameOutput=!top.outputItemId||!other.outputItemId||top.outputItemId===other.outputItemId;
    o.dailySessions[l]=Object.assign({},top,{review:v.review===true||w.review===true?true:v.review||w.review,
      lesson:sameLesson?(v.lesson===true||w.lesson===true?true:v.lesson||w.lesson):top.lesson,
      output:sameLesson&&sameOutput?(v.output||w.output):top.output,
      outputItemId:top.outputItemId||(sameLesson?other.outputItemId:undefined),
      outputHelp:sameLesson&&sameOutput?!!(v.outputHelp||w.outputHelp):!!top.outputHelp,
      celebrated:!!(v.celebrated||w.celebrated)});
  }
  o.evidence=(o.evidence||[]).map(e=>{
    const s=o.dailySessions[e.l],parts=e.id.split("|");
    if(e.kind==="output"&&s&&s.outputHelp&&s.day===+parts[1]&&s.outputItemId===(e.key||parts[3]))return Object.assign({},e,{kind:"practice",id:[e.l,s.day,"practice",e.key||parts[3]].join("|"),title:"Mondatot gyakoroltál segítséggel"});
    return e;
  }).filter((e,i,a)=>a.findIndex(x=>x.id===e.id)===i);
  o.onboardingSample=Object.assign({},older.onboardingSample||{},newer.onboardingSample||{});
  o.sk={};for(const k of ["read","listen","write","speak"]){const seen=new Set();o.sk[k]=[...((a.sk||{})[k]||[]),...((b.sk||{})[k]||[])].filter(x=>{const id=x.at+"|"+x.src;return !seen.has(id)&&seen.add(id);}).sort((x,y)=>x.at-y.at).slice(-40);}
  o.ev=Object.assign({},older.ev||{});for(const [d,e] of Object.entries(newer.ev||{})){const m=Object.assign({},o.ev[d]||{});for(const [k,n] of Object.entries(e))m[k]=Math.max(m[k]||0,n);o.ev[d]=m;}
  o.own={};for(const l of new Set([...Object.keys(a.own||{}),...Object.keys(b.own||{})])){const seen=new Set();o.own[l]=[...((newer.own||{})[l]||[]),...((older.own||{})[l]||[])].filter(w=>!seen.has(w.id)&&seen.add(w.id));}
  const ks=new Set();o.mlog=[...(a.mlog||[]),...(b.mlog||[])].filter(m=>{const k=m.d+"|"+m.k+"|"+m.q+"|"+m.a;return !ks.has(k)&&ks.add(k);}).sort((x,y)=>x.d-y.d).slice(-400);
  o.xp=Math.max(a.xp||0,b.xp||0);o.onboarded=!!(a.onboarded||b.onboarded);
  o.placed=Object.assign({},older.placed||{},newer.placed||{});
  o.settings=Object.assign({},newer.settings||{});DEVICE_KEYS.forEach(k=>{if(a.settings&&k in a.settings)o.settings[k]=a.settings[k];});
  o.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return o;
}

let QZ=null;
function runQuiz(o){QZ=Object.assign({i:0,ok:0,done:false,miss:[]},o);drawQuiz();}
function drawQuiz(){
  const it=QZ.items[QZ.i];if(!it){const q=QZ;QZ=null;return q.onDone(q.ok,q.items.length,q.miss);}
  if(!it._o)it._o=shuffle(it.o.slice());
  const opts=it._o;QZ.done=false;
  subShell([QZ.backLabel||"Vissza",()=>{QZ=null;(QZ_BACK||renderPractice)();}],QZ.label,esc(QZ.title||""),`<div class="pbar"><div class="track"><div class="fill" style="width:${QZ.i/QZ.items.length*100}%"></div></div><span class="small muted tnum">${QZ.i+1}/${QZ.items.length}</span></div>
    ${QZ.intro&&QZ.i===0?`<div class="card stack">${QZ.intro}</div>`:""}
    <div class="card" style="padding:1.4rem 1.1rem">${it.sub?`<span class="label">${esc(it.sub)}</span>`:""}<div class="big-q" style="font-size:1.45rem;margin-top:.3rem" ${it.huQ?"":LA()}>${blankify(it.q).replace(/___/g,'<span class="blank"></span>')}</div>${it.say?spkBtn(it.say):""}</div>
    <div class="opts">${opts.map((x,j)=>`<button class="opt" data-o="${j}" ${it.huQ?LA():""}><kbd>${j+1}</kbd>${esc(x)}</button>`).join("")}</div><div id="qfb"></div><button class="btn block" id="qgo" hidden>Tovább</button>`,`${QZ.ok} / ${QZ.i}`);
  view.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(QZ.done)return;QZ.done=true;const pick=opts[+b.dataset.o],ok=pick===it.a;
    if(ok){QZ.ok++;fx("ok");}else{fx("bad");QZ.miss.push(it);logMiss(QZ.kind||"quiz",it.q,pick,it.a);}
    view.querySelectorAll("[data-o]").forEach(x=>{const v=opts[+x.dataset.o];if(v===it.a)x.classList.add("right");else if(x===b)x.classList.add("wrong");});
    $("#qfb").innerHTML=`<div class="feedback ${ok?"ok":"bad"}" role="status"><b>${ok?rnd(LG().ok):"Nem egészen."}</b>${ok?"":`<span>Helyes: <span class="ans">${esc(it.a)}</span></span>`}${it.why?`<span class="small" style="color:var(--ink)">${esc(it.why)}</span>`:""}</div>`;
    if(it.q.includes("___"))say(it.q.replace(/___/,it.a));else if(it.say)say(it.say);
    const g=$("#qgo");g.hidden=false;g.focus();g.onclick=()=>{QZ.i++;drawQuiz();};});
}

const certKey=l=>lang()+"-"+l;

/* Restoring replaces the state outright (no merge), so no sync may run in between. */
async function cloudRestore(state){

/* ============ PODCAST LISTENING PRACTICE: GAP FILL AND DICTATION ============ */
function gapsFor(p){
  if(p._gaps)return p._gaps;
  p._gaps=p.lines.map(l=>{const ws=l.it.split(" ");let best=-1,len=0;ws.forEach((w,i)=>{const c=w.replace(/[^\p{L}']/gu,"");if(i>0&&c.length>len&&c.length>=4){best=i;len=c.length;}});return best;});
  return p._gaps;
}
function drawGap(){
  const {p}=PD,g=gapsFor(p),chk=PD.gapChk;
  const line=(l,k)=>{const ws=l.it.split(" ");return ws.map((w,i)=>{if(i!==g[k])return esc(w);const core=w.replace(/[^\p{L}']/gu,""),tail=w.slice(w.indexOf(core)+core.length),head=w.slice(0,w.indexOf(core));

/* ============ HANDS-FREE REVIEW (car mode) ============ */
let CAR=null;
function sayHu(text){
  return new Promise(res=>{try{player.pause();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="hu-HU";const v=speechSynthesis.getVoices().find(x=>/^hu/i.test(x.lang));if(v)u.voice=v;u.rate=1;u.onend=res;u.onerror=res;setTimeout(res,1500+text.length*110);speechSynthesis.speak(u);}catch(e){res();}});
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function startCar(){
  const due=dueList().sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
  const extra=POOL.filter(c=>S.cards[c.id]&&!due.includes(c)).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
  const q=[...due,...extra].slice(0,30);
  if(!q.length){toast("Még nincs ismételhető kártya. Fejezz be egy leckét vagy egy napi kört.");return;}
  prefetch(...new Set(q.map(c=>LESSONS[c.li]&&LESSONS[c.li].id).filter(Boolean)));
  CAR={q,i:0,run:true,phase:"",done:0,lock:null};
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(l=>{if(CAR)CAR.lock=l;}).catch(()=>{});}catch(e){}
  drawCar();carLoop();
}
function stopCar(){if(!CAR)return;CAR.run=false;try{CAR.lock&&CAR.lock.release();}catch(e){}try{player.pause();speechSynthesis.cancel();}catch(e){}if(sayDone)sayDone();}
function drawCar(){
  const c=CAR.q[CAR.i];
  view.innerHTML=`<div class="player car"><div class="row" style="justify-content:space-between"><button class="btn ghost" id="carStop">Befejezés</button><span class="score tnum">${CAR.i+1} / ${CAR.q.length}</span></div>
    <div class="card stack" style="align-items:center;text-align:center;padding:2rem 1rem;min-height:220px;justify-content:center"><span class="label">${esc(CAR.phase||"Hangos ismétlés")}</span>
      ${c?`<div class="big-q">${esc(c.hu)}</div>${CAR.phase==="Válasz"||CAR.phase==="Értékelés"?`<div class="big-q" style="color:var(--cobalt)" ${LA()}>${esc(c.it)}</div>`:""}`:""}</div>
    <div class="carbtns"><button class="btn" data-cg="0">Újra</button><button class="btn lemon" data-cg="2">Tudtam</button><button class="btn soft" data-cg="3">Könnyű</button></div>
    <p class="small muted" style="text-align:center">${canSpeak()?"Válaszolj hangosan: „tudtam”, „könnyű” vagy „újra”. Ha nem szólsz, a kártya marad a következő alkalomra.":"Az app felolvassa a magyar jelentést, vár, aztán kimondja a választ. Értékelj a nagy gombokkal."}</p></div>`;
  $("#carStop").onclick=()=>{stopCar();const n=CAR.done;CAR=null;toast(`${n} kártyát ismételtél hangosan.`);go("kartyak");};
  view.querySelectorAll("[data-cg]").forEach(b=>b.onclick=()=>{CAR.manual=+b.dataset.cg;if(CAR.phase!=="Értékelés"){try{player.pause();speechSynthesis.cancel();}catch(e){}if(sayDone)sayDone();}});
}
function carGrade(c,g){const isNew=!S.cards[c.id];S.cards[c.id]=sched(S.cards[c.id],g,c.id);logReview(g>0);incEv("reviews");if(g===0)S.miss[c.id]=(S.miss[c.id]||0)+1;if(isNew){const t=today();if(S.newToday.day!==t)S.newToday={day:t,n:0};S.newToday.n++;}CAR.done++;addXP(1);}
async function carLoop(){
  const me=CAR;
  while(me.run&&me.i<me.q.length){
    const c=me.q[me.i];me.manual=null;
    me.phase="Kérdés";drawCar();await sayHu(c.hu);if(!me.run)return;
    for(let t=0;t<35&&me.run&&me.manual==null;t++)await wait(100);if(!me.run)return;
    me.phase="Válasz";drawCar();await say(c.it);if(!me.run)return;
    let g=me.manual;
    if(g==null){me.phase="Értékelés";drawCar();
      if(canSpeak()){try{const alts=(await listen()).join(" ").toLowerCase();g=/újra|nem tudtam|nem|again|no\b/.test(alts)?0:/könnyű|easy/.test(alts)?3:/tudtam|igen|megvan|jó|yes|ok/.test(alts)?2:null;}catch(e){g=null;}}
      else{for(let t=0;t<60&&me.run&&me.manual==null;t++)await wait(100);g=me.manual;}}
    if(!me.run)return;
    if(g!=null)carGrade(c,g);
    me.i++;
  }
  if(me.run&&CAR===me){stopCar();save();view.innerHTML=`<div class="player" style="justify-content:center;align-items:center;text-align:center"><span class="label">Hangos ismétlés</span><h1>${LG().fin[1]}</h1><p class="muted">${me.done} kártyát értékeltél, kéz nélkül.</p><div class="row" style="justify-content:center"><button class="btn ghost" data-go="kartyak">Kártyák</button><button class="btn" id="carAgain">Még egy kör</button></div></div>`;$("#carAgain").onclick=startCar;CAR=null;}
}

document.addEventListener("keydown",e=>{if(!VT||e.target.matches("input,textarea"))return;if(e.key==="1"||e.key==="2"){const b=view.querySelector(`[data-y="${+e.key-1}"]`);if(b)b.click();}});
function vtScore(items,yes,X){
  const ps=items.map((x,i)=>[x,yes[i]]).filter(([x])=>x.b<0),fa=ps.filter(([,y])=>y).length/Math.max(1,ps.length);
  let size=0;X.bands.forEach((b,bi)=>{const ws=items.map((x,i)=>[x,yes[i]]).filter(([x])=>x.b===bi),hit=ws.filter(([,y])=>y).length/Math.max(1,ws.length);
    const r=fa>=1?0:Math.max(0,(hit-fa)/(1-fa));size+=r*(b.to-b.from);});
  size=Math.round(size/50)*50;const level=(X.levels.find(([n])=>size<n)||[0,"C2"])[1];

/* A resumable daily path. Its stages record completed work, never inferred fluency. */
let dailyActive=false;
function dailySession(){
  S.dailySessions=S.dailySessions||{};
  let s=S.dailySessions[lang()];
  if(!s||s.day!==today()){
    const li=nextLesson();
    s={day:today(),lessonId:li===null?null:LESSONS[li].id,review:false,lesson:false,output:false,at:Date.now()};
    S.dailySessions[lang()]=s;
  }
  const li=nextLesson(),current=LESSONS.findIndex(l=>l.id===s.lessonId);
  if(!s.lesson&&((!s.startedAt&&!s.review)||current>=0&&ls(current)&&ls(current).placed)){
    const nextId=li===null?null:LESSONS[li].id;
    if(nextId!==s.lessonId){s.lessonId=nextId;delete s.outputItemId;delete s.outputHelp;}
  }
  return s;
}
function saveDaily(){dailySession().at=Date.now();save();}
function dailySteps(){
  const s=dailySession(),L=LESSONS.find(l=>l.id===s.lessonId);
  return [
    [s.review,"Rövid ismétlés",s.review==="none"?"Most nincs esedékes kártya":s.review?"Az ismétlőkör elkészült":"Néhány esedékes kártya és új szó"],
    [s.lesson,"Egy lecke",s.lesson==="none"?"A kijelölt leckéket már végigvetted":s.lesson?"A mai lecke elkészült":L?L.hu:"Szabad ismétlés"],
    [s.output,"Önálló válasz",s.output?"Válaszgyakorlat elkészült":"Egy mondat felidézése segítség nélkül"]
  ];
}
function startDailyJourney(){dailyActive=true;dailySession().startedAt=dailySession().startedAt||Date.now();saveDaily();continueDaily();}
function continueDaily(){
  dailyActive=true;
  const s=dailySession();
  if(!s.review){
    if(dueList().length||Math.min(newLeft(),newAvail().length))return startRound("daily",{review:S.settings.goal===20?3:6,newCards:S.settings.goal===20?1:2});
    s.review="none";saveDaily();
  }
  if(!s.lesson){
    const li=LESSONS.findIndex(l=>l.id===s.lessonId);
    if(li>=0)return openDailyLesson(li);
    s.lesson="none";saveDaily();
  }
  if(!s.output)return drawDailyOutput();
  finishDailyJourney();
}

    catch(e){if(answer.isConnected&&!s.output)feedback.textContent="A mikrofon most nem érhető el. Írd be a válaszodat.";}

function recordEvidence(kind,key,title,detail){
  S.evidence=Array.isArray(S.evidence)?S.evidence:[];
  const id=[lang(),today(),kind,key].join("|");
  if(S.evidence.some(e=>e.id===id))return;
  S.evidence.push({id,key,l:lang(),kind,title:String(title),detail:String(detail||""),at:Date.now()});
  S.evidence=S.evidence.slice(-80);
}
function milestonesCard(){
  const evidence=(S.evidence||[]).filter(e=>e.l===lang()).slice(-3).reverse();
  const completed=LESSONS.filter((L,i)=>ls(i)&&ls(i).done);
  const pod=XT.pods.find(p=>S.pods[p.id]&&S.pods[p.id].n&&S.pods[p.id].ok===S.pods[p.id].n);

  return `<section class="card stack"><span class="label">Amit már megcsináltál</span><h3>Kézzelfogható haladás</h3>${entries.length?`<div class="milestone-list">${entries.slice(0,3).map(e=>`<div class="milestone-item"><span aria-hidden="true">✓</span><div><b>${esc(e.title)}</b><p class="small muted">${esc(e.detail)}</p></div></div>`).join("")}</div>`:'<p class="small muted">Az első önálló válaszod, befejezett leckéd és egy hét után felidézett kifejezésed itt fog megjelenni.</p>'}</section>`;

/* ============ CORE VOCABULARY (English A1–B2, Italian and Spanish A1–B1) ============ */
/* The most useful words by level. A level that is switched on feeds the new-card queue (after lesson and own words),
   so the daily new-card limit still decides how fast they come. */
/* Switched-on levels per language; the first version kept the English levels at the top level of S.core. */
function coreOn(){
  const c=S.core||(S.core={});
  if(Object.keys(c).some(k=>/^[ABC]\d$/.test(k))){const en={};for(const k of Object.keys(c))if(/^[ABC]\d$/.test(k)){en[k]=c[k];delete c[k];}c.en=Object.assign(en,c.en||{});}
  return c[lang()]||(c[lang()]={});
}
function rebuildCore(){
  POOL=POOL.filter(c=>!c.core);
  if(CORE){const have=new Set(POOL.map(c=>norm(c.it)));
    CORE.levels.forEach(L=>{if(!coreOn()[L.level])return;L.words.forEach(w=>{const n=norm(w.it);if(have.has(n))return;have.add(n);POOL.push({id:w.id,it:w.it,hu:w.hu,alt:[],li:OWN_LI(),core:L.level});});});}
  WORDS=POOL.filter(c=>!c.ph);
}
function coreSuggest(){
  const v=(S.vsize||[]).slice(-1)[0];
  if(v&&lang()==="en")return v.size<900?"A1":v.size<1800?"A2":v.size<2800?"B1":"B2";
  const d=defLevel(),lv=CORE?CORE.levels.map(L=>L.level):["A1"];return lv.includes(d)?d:lv[lv.length-1];
}
function coreStats(L){let seen=0,ok=0;L.words.forEach(w=>{const c=S.cards[w.id];if(c){seen++;if(c.ivl>=21)ok++;}});return {seen,ok};}
function coreCard(){
  if(!CORE){if(!extraReady("core")){const nav=NAVN;loadExtra("core").then(()=>{if(NAVN===nav&&route==="kartyak"&&!CS&&CORE)renderCards();});}return "";}
  const sug=coreSuggest(),total=CORE.levels.reduce((a,L)=>a+L.words.length,0),lvs=CORE.levels.map(L=>L.level);
  return `<div class="sec-head"><h2>Alapszókincs</h2><span class="small muted tnum">${total} szó · ${lvs[0]}–${lvs[lvs.length-1]}</span></div>
  <div class="card stack" style="gap:.7rem"><p class="small muted">A leggyakoribb ${LG().adj} szavak szintenként, felvett kiejtéssel. Kapcsold be a szintedet: a szavai a napi új kártyák közé kerülnek (naponta legfeljebb ${S.settings.newPerDay}, a leckék szavai után).</p>
  <div class="drills">${CORE.levels.map(L=>{const on=!!coreOn()[L.level],st=coreStats(L);
    return `<div class="drill" style="cursor:default"><div class="row" style="justify-content:space-between"><b>${L.level}</b>${L.level===sug?'<span class="pill now">Ajánlott</span>':""}</div>
      <span class="small muted tnum">${L.words.length} szó · ${st.seen} elkezdve · ${st.ok} megy</span><div class="meter" aria-hidden="true"><i style="width:${st.seen/L.words.length*100}%"></i></div>
      <div class="row"><button class="btn ${on?"soft":""}" data-core="${L.level}" aria-pressed="${on}">${on?"✓ Bekapcsolva":"Bekapcsolás"}</button><button class="btn ghost" data-corel="${L.level}">Lista</button></div></div>`;}).join("")}</div></div>`;

/* ============ SKILL LEVELS ============ */
/* A separate level estimate for reading, listening, writing and speaking. Every scored task logs its level and result;
   the estimate is a recency-weighted average of the last eight results on a continuous A1–C2 scale. */
const SKILLS=[["read","Olvasás","Vizsgaolvasás, próbavizsga, folytatásos történetek"],["listen","Hallás utáni értés","Podcastok, folytatásos történetek, próbavizsga"],["write","Írás","Napló, esszé, próbavizsga"],["speak","Beszéd","Szóbeli vizsgáztató, AI-beszélgetés értékelése"]];
const CEFR=["A1","A2","B1","B2","C1","C2"];
function skillLog(k,lv,pct,src){
  const i=CEFR.indexOf(String(lv||"").toUpperCase().slice(0,2));if(i<0||!isFinite(pct))return;
  S.sk=S.sk||{};const a=S.sk[k]||(S.sk[k]=[]);a.push({at:Date.now(),l:lang(),lv:CEFR[i],p:Math.round(Math.max(0,Math.min(100,pct))),src:String(src||"")});
  if(a.length>40)a.splice(0,a.length-40);
}
/* 60% on a task of a level puts you in the middle of that level, 100% at its top, 0% a level below. */
const skillX=e=>{const i=CEFR.indexOf(e.lv);return Math.max(0,Math.min(5.99,e.p>=60?i+0.5+(e.p-60)/80:i-1+e.p/60*1.5));};
function skillEst(k){
  const all=((S.sk||{})[k]||[]).filter(e=>e.l===lang()&&CEFR.includes(e.lv)&&Number.isFinite(e.p));
  const a=all.slice(-8);if(!a.length)return null;
  let w=0,x=0;a.forEach((e,j)=>{x+=skillX(e)*(j+1);w+=j+1;});x/=w;
  return {x,lv:CEFR[Math.floor(x)],frac:x-Math.floor(x),n:all.length,used:a.length};
}
function skillsCard(){

async function shRecord(line){

  const s=SH,n=s.n;S.shadow=S.shadow||{};S.shadow[s.src.id]=Math.max(S.shadow[s.src.id]||0,n);drillStat("shadow",true);incEv("drills");addXP(Math.max(3,n));save();
  shCleanup(s);SH=null;
  subShell(["Árnyékolás",renderShadow],"Árnyékolás",esc(s.src.t),`<div class="card stack" style="text-align:center"><h1>${LG().fin[1]}</h1><p class="muted">${n?`${n} mondatot mondtál utána felvétellel.`:"Végighallgattad a szöveget."} Az árnyékolás akkor hat igazán, ha ugyanazt a szöveget pár napig naponta megismétled.</p><div class="row" style="justify-content:center"><button class="btn" id="shAgain">Még egyszer</button></div></div>`);
  $("#shAgain").onclick=()=>{SH={src:s.src,i:0,url:null,rec:null,stream:null,hide:false,n:0};drawShadow();};
}
/* ============ CARDS FROM YOUR CORRECTIONS ============ */
/* Corrections from the journal, the speaking examiner and the writing tasks land in the mistake log as "wrong → right – why".
   Here they become card suggestions: the learner checks each one (and may edit it) before it joins the flashcards.
   Dismissed suggestions are remembered so they do not come back. */
const FIX_KINDS=["journal","examiner","mock:writing","exam:write","chat"];
const fixNo=()=>{const o=S.fixno||(S.fixno={});return o[lang()]||(o[lang()]=[]);};
const fixKey=(w,r)=>norm(w)+"→"+norm(r);
function fixCandidates(){
  const own=new Set(ownList().map(w=>norm(w.it))),no=new Set(fixNo()),seen=new Set(),out=[];
  (S.mlog||[]).slice().reverse().forEach(m=>{
    if(m.l!==lang()||!FIX_KINDS.includes(m.k)||!m.q||!m.c)return;
    const [right,...why]=m.c.split(" – "),wrong=m.q.trim(),r=(right||"").trim();
    if(!r||!wrong||norm(r)===norm(wrong)||r.length>90)return;
    const k=fixKey(wrong,r);if(seen.has(k)||no.has(k)||own.has(norm(r)))return;seen.add(k);
    out.push({k,wrong,right:r,why:why.join(" – ").trim(),src:m.k});
  });
  return out.slice(0,30);
}
function fixCard(){
  const c=fixCandidates();if(!c.length)return "";
  return `<div class="card next"><div><h3>Kártyák a javításaidból</h3><p class="small muted">${c.length} javítás vár átnézésre a naplóból, a szóbeliből és az írásfeladatokból. Mentés előtt mindegyiket ellenőrizheted.</p></div><button class="btn soft" id="fixGo">Átnézés</button></div>`;
}
function bindFix(){if($("#fixGo"))$("#fixGo").onclick=openFixReview;}
function openFixReview(){
  const c=fixCandidates(),src={journal:"Napló",examiner:"Szóbeli","mock:writing":"Próbavizsga","exam:write":"Esszé",chat:"Beszélgetés"};
  if(!c.length){toast("Nincs átnézendő javítás.");return go("kartyak");}
  subShell(["Kártyák",()=>go("kartyak")],"Kártyák a javításaidból",`${c.length} javaslat`,`<p class="muted">A kártya elején a hibás változat áll, a hátoldalon a helyes. A helyes alakot kell majd felidézned. Javítsd, ha az AI pontatlan volt, és vedd ki a pipát, ha nem szeretnéd tanulni.</p>
    ${c.map((x,i)=>`<div class="card stack" data-fix="${i}" style="gap:.5rem"><label class="row" style="flex-wrap:nowrap;justify-content:flex-start"><input type="checkbox" data-fsel checked style="width:20px;height:20px;flex:none"><b>${i+1}.</b><span class="pill">${esc(src[x.src]||x.src)}</span></label>
      <p class="small">Hibás: <s ${LA()}>${esc(x.wrong)}</s></p>
      <label class="stack" style="gap:.25rem"><span class="small">Helyesen (ezt tanulod)</span><input data-fit value="${esc(x.right)}" ${LA()}></label>
      ${x.why?`<p class="small muted">${esc(x.why)}</p>`:""}</div>`).join("")}
    <div class="row"><button class="btn lemon" id="fixSave">Kijelöltek mentése</button><button class="btn ghost" id="fixSkip">Kijelöletlenek elvetése</button></div>`);
  const pick=sel=>[...view.querySelectorAll("[data-fix]")].filter(el=>el.querySelector("[data-fsel]").checked===sel).map(el=>({x:c[+el.dataset.fix],it:el.querySelector("[data-fit]").value.trim()}));
  $("#fixSave").onclick=()=>{const ok=pick(true).filter(p=>p.it);let n=0;
    ok.forEach(({x,it})=>{if(ownList().some(w=>norm(w.it)===norm(it)))return;ownList().push({id:`${lang()}-own-${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`,it,hu:"Javítsd: "+x.wrong,alt:[],note:x.why?("Javítás: "+x.why).slice(0,120):"Javítás"});fixNo().push(x.k);n++;});
    pick(false).forEach(({x})=>fixNo().push(x.k));if(fixNo().length>500)fixNo().splice(0,fixNo().length-500);
    save();rebuildOwn();fx("ok");toast(n?n+" javítás-kártya mentve.":"Nem mentettél új kártyát.");go("kartyak");};
  $("#fixSkip").onclick=()=>{pick(false).forEach(({x})=>fixNo().push(x.k));save();toast("A kijelöletlen javaslatokat elvetettem.");openFixReview();};
}
/* ============ EXAM GOAL WITH A DATE ============ */
/* The learner sets the exam, the date and the target. The card counts down, compares the skill estimates with the target and
   builds this week's plan around the weakest skill; the closer the exam, the more full mock exams it asks for. */
const GOAL_EXAMS={b2f:["B2 First","B2"],c1a:["C1 Advanced","C1"],ielts:["IELTS Academic","C1"]};
const goalOf=()=>S.goal&&S.goal.date&&GOAL_EXAMS[S.goal.exam]?S.goal:null;
const goalDays=g=>Math.ceil((new Date(g.date+"T12:00:00")-new Date())/864e5);
/* What was done in the last seven days, from the logs the views already keep. */
function goalWeek(){
  const since=Date.now()-7*864e5,t=today(),n=(a,f)=>(a||[]).filter(f).length;
  const mocks=Object.values(S.mock||{}).flat().filter(x=>x.at>=since).length;
  return {mock:mocks,spk:n(S.spk,x=>x.at>=since&&x.l==="en"),journal:n(S.journal,x=>x.at>=since&&x.l==="en"),
    pods:Object.values(S.pods||{}).filter(x=>x.day>t-7).length,read:(S.sk&&S.sk.read||[]).filter(x=>x.at>=since&&x.l==="en").length};
}
function goalPlan(g){
  const days=goalDays(g),tgt=CEFR.indexOf(GOAL_EXAMS[g.exam][1]),w=goalWeek();
  const est=SKILLS.map(([k,l])=>({k,l,e:skillEst(k)})),gaps=est.map(s=>({...s,gap:s.e?tgt+0.5-s.e.x:1})).sort((a,b)=>b.gap-a.gap);
  const act={read:["Olvasás: egy próbavizsga olvasásrésze vagy a vizsgafelkészítő olvasása","exam","read"],listen:["Hallás: két podcast vagy egy folytatásos fejezet","pod","listen"],
    write:["Írás: három napló és egy esszé","journal","write"],speak:["Beszéd: egy szóbeli vizsga és két árnyékolás","examiner","speak"]};
  const items=[];
  items.push([days<=14?"Teljes próbavizsga ezen a héten (időre)":days<=56?"Próbavizsga kéthetente: ha a múlt héten nem volt, most jöhet":"Havonta egy teljes próbavizsga","mock",w.mock?"✓ "+w.mock+" kész a héten":""]);
  gaps.slice(0,2).forEach(s=>{const a=act[s.k];items.push([a[0]+(s.e?` (most kb. ${s.e.lv})`:" (még nincs adat)"),a[1],s.k==="write"&&w.journal?`${w.journal} napló a héten`:s.k==="speak"&&w.spk?`${w.spk} szóbeli a héten`:s.k==="listen"&&w.pods?`${w.pods} podcast a héten`:""]);});
  items.push(["Napi 10 perc kártya: alapszókincs és kollokációk","colloc",""]);
  return {days,items,gaps};
}
function goalCard(){
  if(lang()!=="en")return "";
  const g=goalOf();
  if(!g)return `<div class="card stack"><h3>Vizsgacél</h3><p class="small muted">Add meg, melyik vizsgára készülsz és mikor: az app visszaszámol, és heti tervet állít össze a leggyengébb készségedre.</p>${goalForm({})}</div>`;
  const P=goalPlan(g),[name,lv]=GOAL_EXAMS[g.exam];
  return `<div class="card stack" id="goalCard"><div class="row" style="justify-content:space-between"><h3>Vizsgacél: ${esc(name)}</h3><span class="pill ${P.days<=14?"bad":"now"} tnum">${P.days>0?P.days+" nap":P.days===0?"ma":"lejárt"}</span></div>
    <p class="small muted">${new Date(g.date+"T12:00:00").toLocaleDateString("hu-HU",{year:"numeric",month:"long",day:"numeric"})} · cél: ${esc(g.target||lv)}</p>
    <div class="stack" style="gap:.35rem">${P.gaps.map(s=>`<div class="row small" style="justify-content:space-between"><span>${s.l}</span><span class="pill ${s.e&&s.gap<=0?"ok":""}">${s.e?"kb. "+s.e.lv+(s.gap<=0?" ✓":""):"nincs adat"}</span></div>`).join("")}</div>
    <div><b>Ezen a héten</b><ul class="stack" style="gap:.45rem;padding-left:0;list-style:none;margin-top:.4rem">${P.items.map(([t,k,d])=>`<li class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:.5rem"><span class="small">${esc(t)}${d?` <span class="pill ok">${esc(d)}</span>`:""}</span><button class="btn ghost" data-gd="${k}" style="padding:.35rem .7rem;font-size:.85rem;flex:none">Indítás</button></li>`).join("")}</ul></div>
    <p class="small muted">A készségszintek gyakorlási becslések; a terv ezekből választja ki, mire érdemes most több időt szánni.</p>
    <details><summary class="small" style="cursor:pointer">Cél módosítása</summary>${goalForm(g)}</details></div>`;
}
function goalForm(g){
  return `<div class="stack" style="gap:.5rem;margin-top:.5rem"><label class="stack" style="gap:.25rem"><span class="small">Vizsga</span><select id="gExam">${Object.entries(GOAL_EXAMS).map(([k,[n]])=>`<option value="${k}" ${g.exam===k?"selected":""}>${n}</option>`).join("")}</select></label>
    <label class="stack" style="gap:.25rem"><span class="small">Időpont</span><input type="date" id="gDate" value="${esc(g.date||"")}"></label>
    <label class="stack" style="gap:.25rem"><span class="small">Célszint vagy -sáv (nem kötelező)</span><input id="gTarget" value="${esc(g.target||"")}" placeholder="pl. B2, C1 vagy 6.5"></label>
    <div class="row"><button class="btn" id="gSave">Mentés</button>${g.date?`<button class="btn ghost" id="gDel">Cél törlése</button>`:""}</div></div>`;
}
function bindGoal(rerender){
  if($("#gSave"))$("#gSave").onclick=()=>{const date=$("#gDate").value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast("Add meg a vizsga dátumát.");return;}
    S.goal={exam:$("#gExam").value,date,target:$("#gTarget").value.trim().slice(0,10),at:Date.now()};save();toast("Vizsgacél mentve.");rerender();};
  if($("#gDel"))$("#gDel").onclick=()=>{S.goal=null;save();rerender();};
  view.querySelectorAll("[data-gd]").forEach(b=>b.onclick=()=>{dailyActive=false;route="gyakorlas";render();startDrill(b.dataset.gd);});
}
/* ============ MONTHLY PROGRESS REPORT ============ */
/* One printable page about the last 30 days: activity, vocabulary, skill estimates, results and the recurring mistakes.
   "Nyomtatás / PDF" uses the browser's print dialog (the print stylesheet hides the app chrome); an optional AI summary
   turns the numbers into a short paragraph that is clearly marked as AI text. */
function reportData(){
  const t=today(),from=t-29,since=Date.now()-30*864e5,l=lang();
  let xp=0,days=0,rev=0,ok=0;for(let d=from;d<=t;d++){const v=S.days[d]||0;xp+=v;if(v)days++;const g=S.log[d];if(g){rev+=g.n;ok+=g.ok;}}
  const ev={};for(let d=from;d<=t;d++)Object.entries(S.ev[d]||{}).forEach(([k,n])=>ev[k]=(ev[k]||0)+n);
  const pc=packCards(),mature=pc.filter(c=>c.ivl>=21).length;
  const mk={};monthMisses().forEach(m=>mk[m.k]=(mk[m.k]||0)+1);
  const mocks=Object.entries(S.mock||{}).flatMap(([id,h])=>h.filter(x=>x.at>=since).map(x=>({id,...x})));
  return {xp,days,rev,ret:rev?Math.round(ok/rev*100):null,ev,cards:pc.length,mature,lessons:doneCount(),
    skills:SKILLS.map(([k,lbl])=>({lbl,e:skillEst(k)})),miss:Object.entries(mk).sort((a,b)=>b[1]-a[1]).slice(0,5),mocks,
    spk:(S.spk||[]).filter(x=>x.at>=since&&x.l===l),journal:(S.journal||[]).filter(x=>x.at>=since&&x.l===l)};
}
function reportCard(){return `<div class="card next"><div><h3>Havi riport</h3><p class="small muted">Egy oldal az elmúlt 30 napról: aktivitás, szókincs, készségek, eredmények, visszatérő hibák. Kinyomtatható vagy PDF-be menthető, tanárnak is megmutatható.</p></div><button class="btn soft" id="repGo">Megnyitás</button></div>`;}
function renderReport(){
  stopViews();const R=reportData(),d0=new Date(Date.now()-29*864e5),d1=new Date(),f=d=>d.toLocaleDateString("hu-HU",{month:"long",day:"numeric"});
  const rep=S.ai["report-"+lang()];
  view.innerHTML=`<div class="stack report">
  <div class="row no-print"><button class="btn ghost" data-go="stat">← Statisztika</button><button class="btn" id="repPrint">Nyomtatás / PDF</button><button class="btn soft" id="repAI">AI-összegzés</button></div>
  <div><span class="label">Parliamo · ${LG().name} · havi riport</span><h1>${f(d0)} – ${f(d1)}</h1></div>
  <div class="card"><div class="stats">
    <div class="stat"><span class="label">Aktív napok</span><b class="tnum">${R.days} / 30</b></div>
    <div class="stat"><span class="label">XP</span><b class="tnum">${R.xp}</b></div>
    <div class="stat"><span class="label">Ismétlések</span><b class="tnum">${R.rev}</b><span class="small muted">${R.ret===null?"":R.ret+"% helyes"}</span></div>
    <div class="stat"><span class="label">Leckék összesen</span><b class="tnum">${R.lessons}</b></div>
  </div></div>
  <div class="card stack"><h3>Szókincs</h3><p>${R.cards} kártya tanulásban, ebből <b>${R.mature}</b> már biztosan megy (21+ napos időköz).</p>
    <p class="small muted">A hónapban: ${R.ev.reviews||0} kártyaismétlés, ${R.ev.drills||0} gyakorlófeladat, ${R.ev.pods||0} podcast, ${R.ev.stories||0} történet.</p></div>
  <div class="card stack"><h3>Készségek (gyakorlási becslés)</h3>${R.skills.map(s=>`<div class="row" style="justify-content:space-between"><span>${s.lbl}</span><span class="pill">${s.e?"kb. "+s.e.lv:"nincs adat"}</span></div>`).join("")}</div>
  ${R.mocks.length||R.spk.length||R.journal.length?`<div class="card stack"><h3>Eredmények</h3>
    ${R.mocks.map(m=>`<div class="row" style="justify-content:space-between"><span>Próbavizsga (${esc((XT.mock.find(x=>x.id===m.id)||{}).title||m.id)}) · ${new Date(m.at).toLocaleDateString("hu-HU")}</span><span class="pill">${m.pct}% · ${esc(m.grade||"")}</span></div>`).join("")}
    ${R.spk.length?`<div class="row" style="justify-content:space-between"><span>Szóbeli gyakorlás</span><span class="pill">${R.spk.length} alkalom</span></div>`:""}
    ${R.journal.length?`<div class="row" style="justify-content:space-between"><span>Napló</span><span class="pill">${R.journal.length} bejegyzés · átlag ${Math.round(R.journal.reduce((a,x)=>a+(x.n||0),0)/R.journal.length*10)/10} javítás</span></div>`:""}</div>`:""}
  <div class="card stack"><h3>Visszatérő hibák</h3>${R.miss.length?R.miss.map(([k,n])=>`<div class="row" style="justify-content:space-between"><span>${esc(mkLabel(k))}</span><span class="tnum">${n}</span></div>`).join(""):`<p class="small muted">Ebben a hónapban nem gyűlt össze elemezhető hiba.</p>`}</div>
  <div id="repAIout">${rep?`<div class="card stack"><span class="label">AI-összegzés · ${new Date(rep.at).toLocaleDateString("hu-HU")}</span><p>${esc(rep.text)}</p></div>`:""}</div>
  <p class="small muted">A szintek és a vizsgaeredmények gyakorlási becslések, nem hivatalos nyelvvizsga-eredmények.</p></div>`;
  $("#repPrint").onclick=()=>{try{window.print();}catch(e){toast("A nyomtatás itt nem érhető el.");}};
  $("#repAI").onclick=async()=>{const sample=await getSample();if(!sample){$("#repAIout").innerHTML=`<div class="notice">${aiMissing()}</div>`;return;}
    $("#repAI").disabled=true;$("#repAIout").innerHTML=`<div class="card row"><span class="thinking"><i></i><i></i><i></i></span><span class="muted">Összegzés készül…</span></div>`;
    const sum={aktiv_napok:R.days,xp:R.xp,ismetlesek:R.rev,helyes_arany:R.ret,kartyak:R.cards,biztos_szavak:R.mature,keszsegek:R.skills.map(s=>[s.lbl,s.e?s.e.lv:null]),hibak:R.miss.map(([k,n])=>[mkLabel(k),n]),probavizsgak:R.mocks.map(m=>m.pct),szobeli:R.spk.length,naplo:R.journal.length};
    try{const r=await sample(`Egy magyar anyanyelvű ${LG().adj} nyelvtanuló elmúlt 30 napjának adatai (JSON): ${JSON.stringify(sum)}
Írj róla 3–4 mondatos, barátságos, konkrét magyar összefoglalót: mi ment jól, mire figyeljen a következő hónapban, és egy gyakorlati javaslatot. Ne találj ki adatot, csak a fentiekből dolgozz, és ne nevezd a szinteket hivatalos eredménynek. Csak a szöveget add vissza.`,{modelTier:"quick"});
      const text=String(r.text||"").trim();if(text){S.ai["report-"+lang()]={at:Date.now(),text};save();}
      if($("#repAIout"))$("#repAIout").innerHTML=`<div class="card stack"><span class="label">AI-összegzés</span><p>${esc(text)}</p></div>`;}
    catch(e){if($("#repAIout"))$("#repAIout").innerHTML=`<div class="notice">${esc(aiErr(e))}</div>`;}
    if($("#repAI"))$("#repAI").disabled=false;};
  window.scrollTo(0,0);
}
</script>
