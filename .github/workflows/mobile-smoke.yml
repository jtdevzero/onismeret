name: Mobile browser smoke & screenshots
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start static site
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/party-server.log 2>&1 &
      - name: Mobile smoke + screenshots
        run: node tarsas/tests/mobile-smoke.cjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
