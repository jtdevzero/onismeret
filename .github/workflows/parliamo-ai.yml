name: Parliamo AI-szerver telepítése
# Kézzel indítható: Actions fül → „Parliamo AI-szerver telepítése” → Run workflow.
# Szükséges titkok (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY, PARLIAMO_APP_PASSWORD
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Függőségek a lockfile szerint
        working-directory: parliamo/worker
        run: npm ci
      - name: Telepítés a Cloudflare-re
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: parliamo/worker
          wranglerVersion: "4.148.0"
          secrets: |
            ANTHROPIC_API_KEY
            APP_PASSWORD
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_PASSWORD: ${{ secrets.PARLIAMO_APP_PASSWORD }}
