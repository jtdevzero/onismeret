name: GitHub Pages – közzététel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tarsas/tests/v2-smoke.test.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/party-server.log 2>&1 &
      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/tarsas/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/party-server.log
          exit 1
      - name: Verify mobile game screens and dilemma voting
        run: node tarsas/tests/mobile-smoke.cjs
      - name: Save screenshots on any outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mobile-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
      - run: |
          node --check tarsas/app.js
          node --check paros/app.js
          node --check tarsas/sw.js
          node --check paros/sw.js
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

  live-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify published GitHub Pages routes
        run: |
          set -eu
          BASE="https://jtdevzero.github.io/onismeret"
          for route in tarsas/ paros/ tarsas/activity18/ tarsas/homlok/ tarsas/atkozott/ tarsas/harry-potter/; do
            echo "Checking $BASE/$route"
            curl --fail --location --retry 5 --retry-delay 3 --retry-connrefused --silent --show-error "$BASE/$route" -o /tmp/page.html
            test -s /tmp/page.html
          done
