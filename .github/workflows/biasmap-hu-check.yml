name: BiasMap HU checks
on:
  push:
    paths:
      - 'biasmap-hu/**'
      - '.github/workflows/biasmap-hu-check.yml'
  pull_request:
    paths:
      - 'biasmap-hu/**'
      - '.github/workflows/biasmap-hu-check.yml'
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node biasmap-hu/scripts/verify.cjs
      - run: node biasmap-hu/teszt/verify.cjs
      - run: node biasmap-hu/teszt/audit-content.cjs
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Preview HTTP server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/biasmap-preview.log 2>&1 &
      - name: Browser smoke at desktop and mobile widths
        run: node biasmap-hu/teszt/browser-smoke.cjs
