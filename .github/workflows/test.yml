name: Ellenőrzés
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Függőségek a lockfile szerint
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Generált fájlok egyeznek a forrással
        run: |
          python3 tools/build.py
          if ! git diff --quiet; then
            echo "A build után generálatlan módosítás maradt. Futtasd helyben: python3 tools/build.py"
            git diff --stat
            exit 1
          fi
      - name: Tesztek (linkek, séma, pontozás, felület)
        run: npm test
