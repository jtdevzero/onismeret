name: Ellenőrzés
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright telepítése
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Generált oldalak egyeznek a forrással
        run: |
          python3 tools/build.py
          if ! git diff --quiet -- '*.html'; then
            echo "A generált oldalak eltérnek a src/ forrástól. Futtasd helyben: python3 tools/build.py"
            git diff --stat
            exit 1
          fi
      - name: Tesztek
        run: node tests/run.js
