name: Ellenőrzés
on: [push, pull_request]
# A munkafolyamat csak olvassa a repót; írási jogot egyik lépés sem kap.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Függőségek a lockfile szerint
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Generált fájlok egyeznek a forrással
        run: |
          python3 tools/build.py
          python3 parliamo/build.py
          if ! git diff --quiet; then
            echo "A build után generálatlan módosítás maradt. Futtasd helyben: python3 tools/build.py és python3 parliamo/build.py"
            git diff --stat
            exit 1
          fi
      - name: Tesztek (linkek, séma, pontozás, felület)
        run: npm test
      - name: Parliamo AI-szerver (worker) tesztjei
        working-directory: parliamo/worker
        run: |
          npm ci
          npm test
      - name: Parliamo böngészős végpontteszt
        run: node parliamo/tests/run.js
      - name: Parliamo tanulási útvonal és visszajelzés
        run: |
          node parliamo/tests/guided-session.js
          node parliamo/tests/daily-async.js
          node parliamo/tests/onboarding-placement.js
          node parliamo/tests/ai-setup-review.js
          node parliamo/tests/speech-feedback.js
          node parliamo/tests/practice-feedback.test.js
