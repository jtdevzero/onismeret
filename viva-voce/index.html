<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viva Voce</title>
<meta name="description" content="Olasz nyelvtanulás FSRS ismétléssel, valós mondatokkal és kiejtésgyakorlással.">
<meta name="theme-color" content="#f8fafc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="Viva Voce főoldal">
    <span class="logo" aria-hidden="true"></span>
    <span class="brand-name">Viva Voce</span>
  </a>
  <div class="streak" id="streak" title="Ennyi napja tanulsz megszakítás nélkül">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5.5C9.8 9.5 10 11 11 12c0-3.5.5-6.5 1-10z"/></svg>
    <span class="streak-n" id="streakN">0</span>
    <span class="sr-only">napos sorozat</span>
  </div>
</header>

<main id="app" aria-live="polite">
  <p class="loading">Betöltés…</p>
</main>

<nav class="tabbar" aria-label="Fő navigáció">
  <button data-view="home" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Ma</span>
  </button>
  <button data-view="library">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h9a4 4 0 0 1 4 4v12H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg><span>Tananyag</span>
  </button>
  <button data-view="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg><span>Haladás</span>
  </button>
  <button data-view="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Beállítások</span>
  </button>
</nav>

<div id="sheet" class="sheet" hidden></div>

<noscript><p class="loading">A Viva Voce JavaScriptet igényel.</p></noscript>
<script src="fsrs.js?v=2"></script>

</body>
</html>
