<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#140e22"><title>Átkozott döntések · Társasest</title><style>:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#140e22;color:#fff2e7}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);background:radial-gradient(ellipse at 12% 4%,#65204c99,transparent 48%),radial-gradient(ellipse at 96% 50%,#4d347099,transparent 55%),#140e22}main{max-width:760px;margin:auto;padding:18px 0 40px}a{color:#ffcc89}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{color:#ffc88d;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(2.3rem,9vw,4.1rem);line-height:1.06;margin:32px 0 8px;letter-spacing:-.05em}p{color:#c8b9d0}.panel{background:linear-gradient(145deg,#30203f,#1e1931);border:1px solid #81618d77;border-radius:24px;padding:22px;box-shadow:0 20px 55px #0005}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.chip,button{font:inherit;cursor:pointer}.chip{border:1px solid #745575;background:#281d37;color:#f9e6f7;border-radius:100px;padding:10px 14px;min-height:44px}.chip.active{background:#f4ac67;color:#201124;border-color:#f4ac67;font-weight:800}.choice{display:block;width:100%;text-align:left;border:1px solid #79587f;background:linear-gradient(120deg,#392549,#241d38);color:white;border-radius:18px;padding:22px;margin:12px 0;min-height:105px;font-size:clamp(1.1rem,4vw,1.42rem);font-weight:750;box-shadow:0 9px 25px #0003}.choice.selected{border:2px solid #ffc17c;background:linear-gradient(120deg,#60364c,#382d62)}.choice span{display:block;font-size:.75rem;letter-spacing:.12em;color:#ffce97;margin-bottom:8px}button:focus-visible,a:focus-visible{outline:3px solid #ffcc89;outline-offset:3px}.next{width:100%;border:0;border-radius:15px;background:linear-gradient(120deg,#ffb56a,#fa6aa0);color:#241021;font-weight:850;min-height:54px;margin-top:14px}.next:disabled{opacity:.45}.meter{height:11px;overflow:hidden;background:#201528;border-radius:10px;margin:12px 0}.meter>div{height:100%;background:linear-gradient(90deg,#ffaf64,#e66acb)}.muted{font-size:.9rem}.result{margin:10px 0;padding:15px;border:1px solid #846c92;border-radius:15px}.footer{margin-top:24px;text-align:center}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><main><div class="head"><a href="../">← Társasest</a><span class="eyebrow">💀 Premium party</span></div><h1>Átkozott<br>döntések</h1><p>Két borzalom. Egy választás. Add körbe a telefont, és nézzétek meg, ki mit vállalna be!</p><div class="chips" id="categories"></div><div class="panel"><div class="head"><strong id="category"></strong><span id="progress" class="muted"></span></div><div id="game" aria-live="polite"></div></div><p class="footer muted">Az eredmények csak ezen a készüléken, az aktuális játékban élnek.</p></main><script>const PACKS={"Undorító":[["Állandó szarszagod legyen, amit csak mások éreznek","Csak te érezz állandó szarszagot, mindenhol"],["Minden csóknál hagymaszagú legyen a leheleted","Minden ölelésnél halszagú legyen a ruhád"],["Mindig nedves legyen a zoknid","Mindig morzsa legyen az ágyadban"],["Minden ételnek fogkrémíze legyen","Minden italnak savanyúuborka-íze legyen"],["Minden tüsszentésed után csuklanod kelljen","Minden csuklásod után böfögnöd kelljen"],["Minden reggel ragadjon a kezed","Minden este ragadjon a lábad"],["Soha ne érezd, hogy tiszta a fogad","Soha ne érezd, hogy száraz a hajad"],["Minden szobában legyen egy zümmögő légy","Minden szobában legyen egy láthatatlan szúnyog"],["Minden cipőd nyikorogjon","Minden kabátod zörögjön"],["A párnád mindig langyos legyen","A takaród mindig túl rövid legyen"],["Minden zoknid két különböző szagú legyen","Minden pólódnak menzaszaga legyen"],["Minden liftben finghangot adjon a cipőd","Minden adj második esélyt"],["Mindig vállald mások hibáját","Soha ne kapj elismerést a saját sikeredért"]]};let cat=Object.keys(PACKS)[0],idx=0,votes=[0,0],people=0,selected=-1,phase='vote';const $=id=>document.getElementById(id);function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const decks=Object.fromEntries(Object.entries(PACKS).map(([k,v])=>[k,shuffle(v.slice())]));function reset(){idx=0;votes=[0,0];people=0;selected=-1;phase='vote';render()}function render(){ $('categories').innerHTML=Object.keys(PACKS).map(k=>'<button class="chip '+(k===cat?'active':'')+'" data-cat="'+k+'">'+k+'</button>').join('');$('category').textContent=cat;$('progress').textContent=(idx+1)+' / '+decks[cat].length;const q=decks[cat][idx];if(phase==='vote'){$('game').innerHTML='<p class="muted">Szavazó: '+(people+1)+'. fő · a választás után add tovább a telefont!</p>'+q.map((v,i)=>'<button class="choice '+(selected===i?'selected':'')+'" data-vote="'+i+'"><span>OPCIÓ '+(i?'B':'A')+'</span>'+v+'</button>').join('')+'<button class="next" id="cast" '+(selected<0?'disabled':'')+'>Szavazat leadása</button><button class="chip" id="reveal" '+(!people?'disabled':'')+'>Eredmény megtekintése</button>';}else{$('game').innerHTML='<p>'+people+' titkos szavazat</p>'+q.map((v,i)=>'<div class="result"><strong>'+(i?'B':'A')+' · '+votes[i]+' szavazat ('+(people?Math.round(votes[i]/people*100):0)+'%)</strong><div class="meter"><div style="width:'+(people?votes[i]/people*100:0)+'%"></div></div><span>'+v+'</span></div>').join('')+'<button class="next" id="next">Következő dilemma →</button>'}}document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.cat){cat=t.dataset.cat;reset();return}if(t.dataset.vote!==undefined){selected=Number(t.dataset.vote);render();return}if(t.id==='cast'&&selected>=0){votes[selected]++;people++;selected=-1;render();return}if(t.id==='reveal'&&people){phase='result';render();return}if(t.id==='next'){idx=(idx+1)%decks[cat].length;if(idx===0)shuffle(decks[cat]);votes=[0,0];people=0;selected=-1;phase='vote';render();}});render();</script></body></html>
